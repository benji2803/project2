<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jake's Giga Pet care game">
    <title>Jake's Giga Pet</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <p class="eyebrow">DIGITAL PET CARE CENTER</p>
        <h1>Jake's Giga Pet</h1>
        <p class="subtitle">Take care of Jake and keep the tail wags coming.</p>
      </header>

      <section class="pet-card" aria-label="Jake's current status">
        <div class="pet-image-container">
          <img
            class="pet-image"
            src="images/pixel-pup.svg"
            alt="Pixel art dog named Mochi sitting on a blue cushion"
          >
          <p class="pet-caption">Jake is ready for attention!</p>
        </div>

        <div class="dashboard">
          <div class="stat-row">
            <span class="stat-label">Name</span>
            <strong class="stat-value name"></strong>
          </div>
          <div class="stat-row">
            <span class="stat-label">Weight</span>
            <strong class="stat-value"><span class="weight"></span> pounds</strong>
          </div>
          <div class="stat-row">
            <span class="stat-label">Happiness</span>
            <strong class="stat-value"><span class="happiness"></span> tail wags/min</strong>
          </div>
          <div class="stat-row">
            <span class="stat-label">Mood</span>
            <strong class="stat-value mood">Feeling curious</strong>
          </div>

          <div class="notification" role="status" aria-live="polite"></div>

          <div class="button-container" aria-label="Pet actions">
            <button class="action-button treat-button" type="button">Give Treat</button>
            <button class="action-button play-button" type="button">Play</button>
            <button class="action-button exercise-button" type="button">Exercise</button>
            <button class="action-button groom-button" type="button">Groom</button>
          </div>
        </div>
      </section>

      <footer class="game-footer">
        <p>Tip: Every action changes Jake's stats, so choose wisely.</p>
      </footer>
    </main>

    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
    <script src="script.js"></script>
  </body>
</html>
